name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and run self-test (JDK 21)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build sources
        shell: pwsh
        run: .\build.ps1

      - name: Run detection self-test
        shell: pwsh
        run: java -cp "bin;lib/flatlaf-3.4.1.jar" com.sentinel.av.TestRunner

      - name: Package runnable fat JAR
        shell: pwsh
        run: .\build_jar.ps1

      - name: Verify packaged JAR
        shell: pwsh
        run: |
          java -jar SentinelAV.jar --version
          java -jar SentinelAV.jar --selftest

      - name: Upload runnable JAR
        uses: actions/upload-artifact@v4
        with:
          name: SentinelAV
          path: SentinelAV.jar
          if-no-files-found: error
